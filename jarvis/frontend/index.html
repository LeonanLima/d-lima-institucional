<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S</title>
<style>
  :root {
    --cyan: #4fe6ff;
    --cyan-soft: #6ff;
    --cyan-dim: #1c6a80;
    --amber: #ffb648;
    --bg: #02060c;
    --hud-font: "Consolas", "SFMono-Regular", "Segoe UI", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #01040a;
    color: var(--cyan);
    font-family: var(--hud-font);
    user-select: none;
    -webkit-user-select: none;
  }

  /* Canvas do HUD (reator, aneis, visualizador) ocupa a tela toda */
  #hud { position: fixed; inset: 0; z-index: 0; display: block; }

  /* Camada de sobreposicao (textos, telemetria, controles) */
  .overlay { position: fixed; inset: 0; z-index: 2; pointer-events: none; }

  /* Molduras de canto estilo HUD */
  .corner { position: fixed; width: 46px; height: 46px; border: 2px solid var(--cyan-dim); z-index: 2; opacity: 0.8; }
  .corner.tl { top: 18px; left: 18px; border-right: none; border-bottom: none; }
  .corner.tr { top: 18px; right: 18px; border-left: none; border-bottom: none; }
  .corner.bl { bottom: 18px; left: 18px; border-right: none; border-top: none; }
  .corner.br { bottom: 18px; right: 18px; border-left: none; border-top: none; }

  /* Linha de varredura + vinheta */
  .scan { position: fixed; inset: 0; z-index: 3; pointer-events: none;
    background: repeating-linear-gradient(180deg, transparent 0, transparent 2px, rgba(0,0,0,0.18) 3px, transparent 4px);
    mix-blend-mode: overlay; opacity: 0.5; }
  .vignette { position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(circle at 50% 45%, transparent 40%, rgba(0,0,0,0.75) 100%); }

  .top { position: fixed; top: 34px; left: 0; right: 0; text-align: center; z-index: 4; }
  .top h1 { font-size: clamp(1.3rem, 3.4vw, 2.1rem); font-weight: 400; letter-spacing: 0.55em;
    color: var(--cyan); text-shadow: 0 0 22px rgba(79,230,255,0.7); }
  .top .sub { margin-top: 8px; font-size: 0.72rem; letter-spacing: 0.35em; color: var(--cyan-dim); text-transform: uppercase; }

  /* Telemetria falsa nos cantos, para dar "vida" de HUD */
  .telem { position: fixed; z-index: 4; font-size: 0.66rem; letter-spacing: 0.12em;
    color: var(--cyan-dim); line-height: 1.7; text-transform: uppercase; }
  .telem.l { top: 84px; left: 40px; text-align: left; }
  .telem.r { top: 84px; right: 40px; text-align: right; }
  .telem b { color: var(--cyan-soft); font-weight: 400; }

  .status { position: fixed; bottom: 168px; left: 0; right: 0; text-align: center; z-index: 4;
    font-size: 0.98rem; letter-spacing: 0.18em; color: var(--cyan); text-transform: uppercase;
    text-shadow: 0 0 14px rgba(79,230,255,0.6); min-height: 1.3em; }

  .log { position: fixed; bottom: 74px; left: 50%; transform: translateX(-50%); z-index: 4;
    width: min(92vw, 720px); max-height: 76px; overflow: hidden; text-align: center; }
  .log p { margin: 3px 0; font-size: 0.92rem; line-height: 1.35; opacity: 0.5; transition: opacity 0.3s; }
  .log p:last-child { opacity: 1; }
  .log .you { color: var(--cyan-soft); }
  .log .jarvis { color: #eafcff; text-shadow: 0 0 10px rgba(79,230,255,0.5); }
  .log .lbl { color: var(--cyan-dim); letter-spacing: 0.1em; }

  .voicebar { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 5;
    display: flex; gap: 8px; align-items: center; font-size: 0.72rem; color: var(--cyan-dim); pointer-events: auto; }
  .voicebar select, .voicebar button {
    background: rgba(6,22,34,0.85); color: var(--cyan-soft); border: 1px solid var(--cyan-dim);
    border-radius: 6px; padding: 4px 9px; font-size: 0.72rem; max-width: 52vw; font-family: var(--hud-font); }
  .voicebar button { cursor: pointer; }
  .voicebar button:hover { border-color: var(--cyan); color: var(--cyan); }

  .warn { position: fixed; bottom: 120px; left: 0; right: 0; text-align: center; z-index: 6;
    color: #ff7a7a; font-size: 0.9rem; }

  /* Sequencia de boot */
  #boot { position: fixed; inset: 0; z-index: 20; background: #01040a; color: var(--cyan);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 0.9rem; letter-spacing: 0.2em; transition: opacity 0.8s ease; }
  #boot.gone { opacity: 0; pointer-events: none; }
  #boot .bl { min-height: 1.5em; text-transform: uppercase; color: var(--cyan-soft); }
  #boot .big { font-size: clamp(1.6rem, 5vw, 3rem); letter-spacing: 0.5em; margin-bottom: 22px;
    text-shadow: 0 0 26px rgba(79,230,255,0.8); }

  @media (prefers-reduced-motion: reduce) { .scan { display: none; } }
</style>
</head>
<body>
  <canvas id="hud"></canvas>
  <div class="vignette"></div>
  <div class="scan"></div>

  <div class="corner tl"></div><div class="corner tr"></div>
  <div class="corner bl"></div><div class="corner br"></div>

  <div class="top">
    <h1>J.A.R.V.I.S</h1>
    <div class="sub" id="sub">Just A Rather Very Intelligent System</div>
  </div>

  <div class="telem l" id="telemL"></div>
  <div class="telem r" id="telemR"></div>

  <div class="status" id="status">Inicializando...</div>
  <div class="log" id="log"></div>
  <div class="warn" id="warn"></div>

  <div class="voicebar">
    <label for="voiceSel">Voz</label>
    <select id="voiceSel"></select>
    <button id="voiceTest" type="button">testar</button>
  </div>

  <div id="boot">
    <div class="big">J.A.R.V.I.S</div>
    <div class="bl" id="bootLine">Inicializando nucleo...</div>
  </div>

  <script>window.JARVIS_TOKEN = "__JARVIS_TOKEN__";</script>
  <script src="/app.js"></script>
</body>
</html>
